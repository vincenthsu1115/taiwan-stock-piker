name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  schedule:
    # 台灣時間週一至週五約 15:30 更新
    - cron: "30 7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download TWSE stock data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone, timedelta

          urls = {
              "prices": "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
              "valuation": "https://openapi.twse.com.tw/v1/exchangeReport/BWIBBU_ALL",
              "revenue": "https://openapi.twse.com.tw/v1/opendata/t187ap05_L"
          }

          def download(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "application/json"
                  }
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8-sig"))

          def pick(d, keys):
              for k in keys:
                  if k in d and d[k] not in (None, ""):
                      return d[k]
              return None

          def number(v):
              if v is None:
                  return None
              try:
                  s = str(v).replace(",", "").replace("--", "").strip()
                  return float(s) if s else None
              except:
                  return None

          # 下載資料
          prices = download(urls["prices"])
          valuation = download(urls["valuation"])
          revenue = download(urls["revenue"])

          # -------------------------
          # 每月營收資料
          # -------------------------
          revenue_map = {}

          for row in revenue:
              code = str(
                  pick(
                      row,
                      ["公司代號", "Code", "股票代號", "證券代號"]
                  ) or ""
              ).strip()

              if not code:
                  continue

              revenue_map[code] = {
                  "industry": str(
                      pick(
                          row,
                          ["產業別", "產業別名稱", "Industry"]
                      ) or ""
                  ).strip(),

                  "revenue_yoy": number(
                      pick(
                          row,
                          [
                              "營業收入-去年同月增減(%)",
                              "去年同月增減(%)",
                              "營收年增率"
                          ]
                      )
                  ),

                  "revenue_ytd_yoy": number(
                      pick(
                          row,
                          [
                              "累計營業收入-前期比較增減(%)",
                              "前期比較增減(%)",
                              "累計營收年增率"
                          ]
                      )
                  )
              }

          # -------------------------
          # PER / PBR / 殖利率
          # -------------------------
          value_map = {}

          for row in valuation:
              code = str(
                  pick(
                      row,
                      ["Code", "股票代號", "證券代號"]
                  ) or ""
              ).strip()

              if not code:
                  continue

              value_map[code] = {
                  "pe": number(
                      pick(row, ["PEratio", "本益比"])
                  ),
                  "pbr": number(
                      pick(row, ["PBratio", "股價淨值比"])
                  ),
                  "yield": number(
                      pick(
                          row,
                          ["DividendYield", "殖利率(%)", "殖利率"]
                      )
                  )
              }

          # -------------------------
          # 合併股票資料
          # -------------------------
          stocks = []

          for row in prices:
              code = str(
                  pick(
                      row,
                      ["Code", "股票代號", "證券代號"]
                  ) or ""
              ).strip()

              name = str(
                  pick(
                      row,
                      ["Name", "股票名稱", "證券名稱"]
                  ) or ""
              ).strip()

              if not (len(code) == 4 and code.isdigit()):
                  continue

              price = number(
                  pick(row, ["ClosingPrice", "收盤價"])
              )

              volume = number(
                  pick(row, ["TradeVolume", "成交股數"])
              )

              if price is None or price <= 0:
                  continue

              v = value_map.get(
                  code,
                  {
                      "pe": None,
                      "pbr": None,
                      "yield": None
                  }
              )

              r = revenue_map.get(
                  code,
                  {
                      "industry": "",
                      "revenue_yoy": None,
                      "revenue_ytd_yoy": None
                  }
              )

              stocks.append({
                  "code": code,
                  "name": name,
                  "price": price,
                  "volume": volume or 0,
                  "pe": v["pe"],
                  "pbr": v["pbr"],
                  "yield": v["yield"],
                  "industry": r["industry"],
                  "revenue_yoy": r["revenue_yoy"],
                  "revenue_ytd_yoy": r["revenue_ytd_yoy"]
              })

          # -------------------------
          # 輸出 stocks.json
          # -------------------------
          taipei = timezone(timedelta(hours=8))

          output = {
              "updated": datetime.now(taipei).isoformat(
                  timespec="seconds"
              ),
              "source": "Taiwan Stock Exchange OpenAPI",
              "count": len(stocks),
              "stocks": stocks
          }

          with open(
              "stocks.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("Created stocks.json")
          print("Stock count:", len(stocks))

          revenue_count = sum(
              1
              for s in stocks
              if s["revenue_yoy"] is not None
          )

          print(
              "Stocks with revenue growth data:",
              revenue_count
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stocks.json

          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Add revenue growth data"
            git push
          fi
