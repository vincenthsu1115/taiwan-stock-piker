<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的台股自動選股器</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Microsoft JhengHei",sans-serif;
}

.container{
  max-width:950px;
  margin:auto;
  padding:20px;
}

h1{
  margin:5px 0;
  font-size:30px;
}

.subtitle{
  color:#6b7280;
  margin:6px 0 20px;
  line-height:1.6;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-weight:700;
  margin-bottom:7px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #d7dce3;
  border-radius:11px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
}

.status{
  display:none;
  margin-top:15px;
  padding:13px;
  border-radius:12px;
  background:#f8fafc;
  line-height:1.6;
}

.success{
  background:#ecfdf5;
  color:#065f46;
}

.error{
  background:#fef2f2;
  color:#991b1b;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:15px;
}

.stat{
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:23px;
  margin-bottom:4px;
}

.updated{
  color:#6b7280;
  font-size:13px;
  margin-top:12px;
}

.stock{
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:17px;
  margin-top:12px;
}

.stockTop{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.rank{
  font-size:13px;
  color:#6b7280;
}

.name{
  font-size:21px;
  font-weight:800;
  margin-top:3px;
}

.code{
  color:#6b7280;
  margin-top:3px;
}

.price{
  text-align:right;
  font-size:22px;
  font-weight:800;
}

.score{
  display:inline-block;
  margin-top:5px;
  padding:5px 10px;
  border-radius:20px;
  background:#eef2ff;
  font-size:14px;
  font-weight:700;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:14px;
}

.metric{
  background:#f8fafc;
  border-radius:11px;
  padding:11px;
  text-align:center;
}

.metric small{
  display:block;
  color:#6b7280;
  margin-bottom:5px;
}

.tags{
  margin-top:13px;
  line-height:2;
}

.tag{
  display:inline-block;
  padding:4px 9px;
  margin-right:4px;
  border-radius:20px;
  background:#ecfdf5;
  font-size:13px;
}

.warning{
  background:#fff7ed;
}

.money{
  background:#f8fafc;
  border-radius:11px;
  padding:12px;
  margin-top:12px;
  line-height:1.7;
  font-size:14px;
}

.note{
  color:#6b7280;
  font-size:13px;
  line-height:1.7;
}

@media(max-width:650px){

  .grid,
  .summary{
    grid-template-columns:1fr;
  }

  .metrics{
    grid-template-columns:1fr 1fr;
  }

  h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<div class="container">

<h1>📈 我的台股自動選股器</h1>

<div class="subtitle">
正式版｜自動掃描市場資料・基本面與估值篩選・避免盲目追高
</div>


<div class="card">

<div class="grid">

<div>

<label>
預計投入金額
</label>

<input
id="budget"
type="number"
value="50000"
>

</div>


<div>

<label>
顯示候選股數量
</label>

<select id="limit">

<option value="10">
前 10 檔
</option>

<option value="20" selected>
前 20 檔
</option>

<option value="30">
前 30 檔
</option>

</select>

</div>

</div>


<button
id="scanButton"
onclick="startScreening()"
>
🔍 開始今日自動選股
</button>


<div
id="status"
class="status"
>
</div>

</div>



<div
id="summaryCard"
class="card"
style="display:none"
>

<strong>
📊 今日掃描結果
</strong>


<div class="summary">

<div class="stat">

<b id="totalCount">
0
</b>

市場資料

</div>


<div class="stat">

<b id="passCount">
0
</b>

通過初篩

</div>


<div class="stat">

<b id="resultCount">
0
</b>

候選股票

</div>

</div>


<div
id="updated"
class="updated"
>
</div>

</div>



<div id="results">
</div>



<div class="card note">

<strong>
目前選股邏輯
</strong>

<br><br>

第一階段使用已自動更新的客觀市場資料：
股價、成交量、本益比（PER）、
股價淨值比（P/B）及殖利率。

<br><br>

程式會排除成交量過低、估值資料不足及
部分極端估值股票，再依估值合理度、
殖利率與市場流動性建立研究候選清單。

<br><br>

這份排序是「研究優先順序」，
不是預測股價，也不是自動買賣建議。

<br><br>

下一階段加入月營收成長、獲利成長與
價格趨勢資料後，才能完整執行原設定的
成長＋基本面＋估值＋趨勢策略。

</div>

</div>



<script>

let marketData = [];


/* =========================
   載入 GitHub 自動更新資料
========================= */

async function loadStockData(){

  const response =
    await fetch(
      "./stocks.json?t=" + Date.now()
    );

  if(!response.ok){

    throw new Error(
      "stocks.json 無法讀取"
    );

  }

  return await response.json();

}



/* =========================
   數字處理
========================= */

function number(v){

  if(
    v === null ||
    v === undefined ||
    v === ""
  ){
    return null;
  }

  const n =
    Number(v);

  return Number.isFinite(n)
    ? n
    : null;

}



/* =========================
   股票評分
========================= */

function evaluate(stock){

  let score = 0;

  const reasons = [];

  const warnings = [];


  const pe =
    number(stock.pe);

  const pbr =
    number(stock.pbr);

  const yieldRate =
    number(stock.yield);

  const volume =
    number(stock.volume) || 0;



  /*
    PER
    最高 40
  */

  if(pe !== null && pe > 0){

    if(pe <= 12){

      score += 40;

      reasons.push(
        "本益比較低"
      );

    }

    else if(pe <= 18){

      score += 34;

      reasons.push(
        "本益比合理"
      );

    }

    else if(pe <= 25){

      score += 25;

      reasons.push(
        "本益比尚可"
      );

    }

    else if(pe <= 35){

      score += 14;

    }

    else{

      score += 4;

      warnings.push(
        "本益比較高"
      );

    }

  }



  /*
    P/B
    最高 25
  */

  if(pbr !== null && pbr > 0){

    if(pbr <= 1.2){

      score += 25;

      reasons.push(
        "P/B 偏低"
      );

    }

    else if(pbr <= 2){

      score += 20;

      reasons.push(
        "P/B 合理"
      );

    }

    else if(pbr <= 3){

      score += 13;

    }

    else if(pbr <= 5){

      score += 6;

    }

    else{

      warnings.push(
        "P/B 偏高"
      );

    }

  }



  /*
    殖利率
    最高 20
  */

  if(yieldRate !== null){

    if(yieldRate >= 5){

      score += 20;

      reasons.push(
        "殖利率較高"
      );

    }

    else if(yieldRate >= 3){

      score += 15;

      reasons.push(
        "具一定殖利率"
      );

    }

    else if(yieldRate >= 1.5){

      score += 9;

    }

    else{

      score += 3;

    }

  }



  /*
    流動性
    最高 15
  */

  if(volume >= 5000000){

    score += 15;

    reasons.push(
      "成交活絡"
    );

  }

  else if(volume >= 1000000){

    score += 12;

  }

  else if(volume >= 300000){

    score += 7;

  }

  else{

    score += 2;

  }



  return {
    score,
    reasons,
    warnings
  };

}



/* =========================
   開始選股
========================= */

async function startScreening(){

  const button =
    document.getElementById(
      "scanButton"
    );

  const status =
    document.getElementById(
      "status"
    );

  const results =
    document.getElementById(
      "results"
    );


  button.disabled = true;

  results.innerHTML = "";

  status.style.display =
    "block";

  status.className =
    "status";

  status.innerHTML =
    "正在讀取今日台股資料並執行選股…";


  try{


    const data =
      await loadStockData();


    marketData =
      Array.isArray(data.stocks)
      ? data.stocks
      : [];


    if(
      marketData.length === 0
    ){

      throw new Error(
        "股票資料為空"
      );

    }



    const candidates = [];


    marketData.forEach(stock=>{


      const price =
        number(stock.price);


      const volume =
        number(stock.volume) || 0;


      const pe =
        number(stock.pe);


      const pbr =
        number(stock.pbr);



      /*
        基本排除條件
      */

      if(
        price === null ||
        price <= 0
      ){
        return;
      }


      if(volume < 100000){

        return;

      }


      if(
        pe === null &&
        pbr === null
      ){

        return;

      }


      /*
        排除極端 PER
      */

      if(
        pe !== null &&
        pe > 60
      ){

        return;

      }



      const evaluation =
        evaluate(stock);


      candidates.push({

        ...stock,

        score:
          evaluation.score,

        reasons:
          evaluation.reasons,

        warnings:
          evaluation.warnings

      });


    });



    candidates.sort(
      (a,b)=>
        b.score - a.score
    );



    const limit =
      Number(
        document.getElementById(
          "limit"
        ).value
      );


    const selected =
      candidates.slice(
        0,
        limit
      );



    document.getElementById(
      "totalCount"
    ).textContent =
      marketData.length
        .toLocaleString();



    document.getElementById(
      "passCount"
    ).textContent =
      candidates.length
        .toLocaleString();



    document.getElementById(
      "resultCount"
    ).textContent =
      selected.length
        .toLocaleString();



    document.getElementById(
      "updated"
    ).textContent =

      data.updated
      ? "資料更新時間：" +
        data.updated
      : "";



    document.getElementById(
      "summaryCard"
    ).style.display =
      "block";



    status.className =
      "status success";


    status.innerHTML =
      "✅ 選股完成。以下為今日研究候選清單。";



    renderResults(
      selected
    );


  }

  catch(error){


    console.error(error);


    status.className =
      "status error";


    status.innerHTML =
      "❌ 無法讀取 stocks.json。請確認 GitHub 自動更新資料已成功產生。";


  }

  finally{


    button.disabled =
      false;


  }

}



/* =========================
   顯示結果
========================= */

function renderResults(stocks){


  const container =
    document.getElementById(
      "results"
    );


  const budget =
    Number(
      document.getElementById(
        "budget"
      ).value
    ) || 50000;



  if(stocks.length === 0){

    container.innerHTML =
      '<div class="card">今天沒有符合條件的股票。</div>';

    return;

  }



  stocks.forEach(
    (stock,index)=>{


      const price =
        number(stock.price) || 0;


      const shares =
        Math.floor(
          budget / price
        );


      const lots =
        Math.floor(
          shares / 1000
        );


      const odd =
        shares % 1000;



      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card stock";



      const reasons =
        stock.reasons.length
        ? stock.reasons
        : [
          "估值資料完整"
        ];



      const warnings =
        stock.warnings.length
        ? stock.warnings
        : [
          "目前無明顯估值警示"
        ];



      card.innerHTML = `

      <div class="stockTop">

        <div>

          <div class="rank">
            候選 #${index + 1}
          </div>

          <div class="name">
            ${escapeHtml(stock.name)}
          </div>

          <div class="code">
            ${escapeHtml(stock.code)}
          </div>

          <div class="score">
            研究分數 ${stock.score}
          </div>

        </div>


        <div class="price">

          $${format(stock.price)}

        </div>

      </div>



      <div class="metrics">


        <div class="metric">

          <small>
            PER
          </small>

          <strong>
            ${show(stock.pe)}
          </strong>

        </div>



        <div class="metric">

          <small>
            P/B
          </small>

          <strong>
            ${show(stock.pbr)}
          </strong>

        </div>



        <div class="metric">

          <small>
            殖利率
          </small>

          <strong>

            ${
              stock.yield !== null &&
              stock.yield !== undefined

              ? format(stock.yield) + "%"

              : "—"
            }

          </strong>

        </div>



        <div class="metric">

          <small>
            成交量
          </small>

          <strong>

            ${
              Math.round(
                stock.volume / 1000
              ).toLocaleString()
            } 張

          </strong>

        </div>


      </div>



      <div class="tags">

        <strong>
          入選原因：
        </strong>

        <br>

        ${
          reasons.map(
            x=>
            `<span class="tag">${escapeHtml(x)}</span>`
          ).join("")
        }

      </div>



      <div class="tags">

        <strong>
          注意：
        </strong>

        ${
          warnings.map(
            x=>
            `<span class="tag warning">${escapeHtml(x)}</span>`
          ).join("")
        }

      </div>



      <div class="money">

        💰 預算
        NT$${budget.toLocaleString()}

        <br>

        理論最多約可買

        <strong>
        ${shares.toLocaleString()} 股
        </strong>

        （${lots} 張 + ${odd} 股零股）

        <br>

        ※ 尚未計入券商手續費。

      </div>

      `;


      container.appendChild(
        card
      );


    }
  );

}



/* =========================
   顯示工具
========================= */

function show(v){

  if(
    v === null ||
    v === undefined
  ){

    return "—";

  }

  return format(v);

}



function format(v){

  const n =
    Number(v);

  if(!Number.isFinite(n)){

    return "—";

  }

  return n.toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:2
    }
  );

}



function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}

</script>

</body>
</html>
