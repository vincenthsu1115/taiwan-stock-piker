<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>我的台股自動選股器</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f8;
  color:#172033;
  font-family:-apple-system,BlinkMacSystemFont,
  "Segoe UI","Microsoft JhengHei",sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

h1{
  margin:5px 0;
  font-size:30px;
}

.subtitle{
  color:#6b7280;
  margin:6px 0 20px;
  line-height:1.6;
}

.panel{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

label{
  display:block;
  font-size:14px;
  color:#64748b;
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #d6dbe3;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  margin-top:14px;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#172033;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.status{
  margin-top:14px;
  padding:12px;
  border-radius:10px;
  background:#f1f5f9;
  line-height:1.6;
}

.logic{
  line-height:1.8;
  font-size:14px;
  color:#475569;
}

.logic strong{
  color:#172033;
}

.results-title{
  margin:25px 0 12px;
}

.stock-card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 3px 14px rgba(0,0,0,.06);
}

.stock-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.stock-name{
  font-size:22px;
  font-weight:800;
}

.stock-code{
  color:#64748b;
  font-size:14px;
  margin-top:3px;
}

.score{
  font-size:24px;
  font-weight:800;
}

.score-label{
  font-size:12px;
  color:#64748b;
  text-align:right;
}

.grade{
  display:inline-block;
  margin-top:8px;
  padding:5px 9px;
  border-radius:999px;
  background:#eef2f7;
  font-size:13px;
  font-weight:700;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:16px;
}

.metric{
  background:#f8fafc;
  border-radius:10px;
  padding:10px;
}

.metric-title{
  color:#64748b;
  font-size:12px;
}

.metric-value{
  margin-top:4px;
  font-size:16px;
  font-weight:700;
}

.positive{
  color:#047857;
}

.negative{
  color:#b91c1c;
}

.reason{
  margin-top:14px;
  line-height:1.7;
  font-size:14px;
}

.reason-title{
  font-weight:700;
}

.warning{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#fff7ed;
  color:#9a3412;
  font-size:13px;
  line-height:1.6;
}

.updated{
  margin-top:20px;
  text-align:center;
  color:#94a3b8;
  font-size:12px;
}

.empty{
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  color:#64748b;
}

@media(max-width:700px){

  .controls{
    grid-template-columns:1fr;
  }

  .metrics{
    grid-template-columns:repeat(2,1fr);
  }

  h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<div class="container">

<h1>📈 我的台股自動選股器</h1>

<div class="subtitle">
成長型選股｜營收動能＋合理估值＋流動性｜避免只看低本益比
</div>

<div class="panel">

<div class="controls">

<div>
<label>投入預算</label>
<input id="budget" type="number" value="50000" min="1000">
</div>

<div>
<label>顯示候選股數量</label>
<select id="limit">
<option value="10">前 10 名</option>
<option value="20" selected>前 20 名</option>
<option value="30">前 30 名</option>
</select>
</div>

</div>

<button onclick="runScreener()">
🔍 開始今日自動選股
</button>

<div id="status" class="status">
等待開始掃描。
</div>

</div>


<div class="panel">

<strong>目前選股邏輯</strong>

<div class="logic">

<strong>營收成長：</strong>
優先尋找最新營收仍維持成長的公司。
<br>

<strong>估值：</strong>
本益比與股價淨值比過高會降低分數，避免只因熱門而追價。
<br>

<strong>流動性：</strong>
成交量過低的股票會被排除。
<br>

<strong>股息：</strong>
殖利率作為輔助條件，不會因高殖利率就直接排到最前面。
<br>

<strong>風險：</strong>
營收衰退、高估值或資料不足會另外提醒。

</div>

</div>


<h2 class="results-title">今日掃描結果</h2>

<div id="results"></div>

<div id="updated" class="updated"></div>

</div>


<script>

let marketData=[];


function num(v){

  if(v===null || v===undefined || v===""){
    return null;
  }

  const n=Number(v);

  return Number.isFinite(n) ? n : null;
}


function fmt(v,digits=1){

  const n=num(v);

  if(n===null){
    return "—";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      maximumFractionDigits:digits
    }
  );
}


function percent(v){

  const n=num(v);

  if(n===null){
    return "—";
  }

  return n.toFixed(1)+"%";
}


async function loadStockData(){

  const response=
    await fetch("./stocks.json?t="+Date.now());

  if(!response.ok){
    throw new Error("stocks.json 無法讀取");
  }

  return await response.json();
}


function revenueScore(yoy){

  if(yoy===null){
    return 4;
  }

  if(yoy>=50){
    return 35;
  }

  if(yoy>=30){
    return 32;
  }

  if(yoy>=20){
    return 28;
  }

  if(yoy>=10){
    return 23;
  }

  if(yoy>=5){
    return 18;
  }

  if(yoy>=0){
    return 12;
  }

  if(yoy>=-10){
    return 5;
  }

  return 0;
}


function valuationScore(pe,pbr){

  let score=0;

  if(pe!==null){

    if(pe<=12){
      score+=20;
    }
    else if(pe<=18){
      score+=18;
    }
    else if(pe<=25){
      score+=15;
    }
    else if(pe<=35){
      score+=10;
    }
    else if(pe<=50){
      score+=5;
    }

  }
  else{
    score+=3;
  }


  if(pbr!==null){

    if(pbr<=1.5){
      score+=10;
    }
    else if(pbr<=2.5){
      score+=8;
    }
    else if(pbr<=4){
      score+=5;
    }
    else if(pbr<=6){
      score+=2;
    }

  }
  else{
    score+=1;
  }


  return score;
}


function dividendScore(yieldRate){

  if(yieldRate===null){
    return 2;
  }

  if(yieldRate>=5){
    return 10;
  }

  if(yieldRate>=3){
    return 8;
  }

  if(yieldRate>=1.5){
    return 5;
  }

  if(yieldRate>0){
    return 3;
  }

  return 1;
}


function liquidityScore(volume){

  if(volume>=5000000){
    return 15;
  }

  if(volume>=1000000){
    return 13;
  }

  if(volume>=500000){
    return 10;
  }

  if(volume>=300000){
    return 7;
  }

  if(volume>=100000){
    return 4;
  }

  return 0;
}


function scoreStock(stock){

  const price=num(stock.price);
  const volume=num(stock.volume) || 0;
  const pe=num(stock.pe);
  const pbr=num(stock.pbr);
  const yieldRate=num(stock.yield);

  const revenueYoy=
    num(
      stock.revenue_yoy ??
      stock.revenueYoy ??
      stock.yoy
    );


  let score=0;

  score+=revenueScore(revenueYoy);
  score+=valuationScore(pe,pbr);
  score+=dividendScore(yieldRate);
  score+=liquidityScore(volume);


  /*
    額外成長獎勵
  */

  if(
    revenueYoy!==null &&
    revenueYoy>=20 &&
    pe!==null &&
    pe<=30
  ){
    score+=5;
  }


  /*
    過熱／高估值扣分
  */

  if(pe!==null && pe>60){
    score-=10;
  }

  if(pbr!==null && pbr>8){
    score-=5;
  }


  /*
    營收明顯衰退扣分
  */

  if(
    revenueYoy!==null &&
    revenueYoy<=-20
  ){
    score-=10;
  }


  score=Math.max(0,Math.min(100,score));


  return {
    ...stock,
    price,
    volume,
    pe,
    pbr,
    yieldRate,
    revenueYoy,
    score
  };
}


function getGrade(stock){

  if(
    stock.revenueYoy!==null &&
    stock.revenueYoy<0
  ){

    if(stock.score>=65){
      return "分數尚可，但營收需觀察";
    }

    return "暫列觀察";
  }


  if(stock.score>=80){
    return "高分研究候選";
  }

  if(stock.score>=65){
    return "研究候選";
  }

  if(stock.score>=50){
    return "持續觀察";
  }

  return "暫不優先";
}


function getReasons(stock){

  const reasons=[];


  if(stock.revenueYoy!==null){

    if(stock.revenueYoy>=30){
      reasons.push(
        "營收年增動能強勁（"+
        percent(stock.revenueYoy)+
        "）"
      );
    }
    else if(stock.revenueYoy>=10){
      reasons.push(
        "營收維持雙位數成長（"+
        percent(stock.revenueYoy)+
        "）"
      );
    }
    else if(stock.revenueYoy>=0){
      reasons.push(
        "營收仍維持正成長（"+
        percent(stock.revenueYoy)+
        "）"
      );
    }
    else{
      reasons.push(
        "營收年增為負（"+
        percent(stock.revenueYoy)+
        "）"
      );
    }

  }
  else{
    reasons.push(
      "目前沒有可使用的營收年增資料"
    );
  }


  if(stock.pe!==null){

    if(stock.pe<=18){
      reasons.push(
        "本益比相對低"
      );
    }
    else if(stock.pe<=30){
      reasons.push(
        "本益比仍在篩選範圍"
      );
    }
    else if(stock.pe>50){
      reasons.push(
        "本益比較高"
      );
    }

  }


  if(stock.volume>=1000000){
    reasons.push(
      "成交流動性佳"
    );
  }


  if(
    stock.yieldRate!==null &&
    stock.yieldRate>=3
  ){
    reasons.push(
      "具一定殖利率"
    );
  }


  return reasons;
}


function getWarnings(stock){

  const warnings=[];


  if(stock.revenueYoy===null){
    warnings.push(
      "缺少營收成長資料"
    );
  }
  else if(stock.revenueYoy<0){
    warnings.push(
      "最新營收年增率為負"
    );
  }


  if(stock.pe!==null && stock.pe>50){
    warnings.push(
      "本益比較高，注意估值風險"
    );
  }


  if(stock.pbr!==null && stock.pbr>6){
    warnings.push(
      "股價淨值比較高"
    );
  }


  return warnings;
}


function renderStock(stock,index,budget){

  const shares=
    stock.price>0
    ? Math.floor(budget/stock.price)
    : 0;

  const lots=
    Math.floor(shares/1000);

  const oddLots=
    shares%1000;

  const reasons=getReasons(stock);
  const warnings=getWarnings(stock);

  const revenueClass=
    stock.revenueYoy!==null &&
    stock.revenueYoy<0
    ? "negative"
    : "positive";


  return `
  <div class="stock-card">

    <div class="stock-header">

      <div>

        <div class="stock-name">
          ${index+1}. ${stock.name || "未命名"}
        </div>

        <div class="stock-code">
          ${stock.code}
        </div>

        <div class="grade">
          ${getGrade(stock)}
        </div>

      </div>


      <div>

        <div class="score">
          ${stock.score}
        </div>

        <div class="score-label">
          研究評分 / 100
        </div>

      </div>

    </div>


    <div class="metrics">

      <div class="metric">
        <div class="metric-title">股價</div>
        <div class="metric-value">
          $${fmt(stock.price,2)}
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          營收年增
        </div>

        <div class="metric-value ${revenueClass}">
          ${percent(stock.revenueYoy)}
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          本益比
        </div>

        <div class="metric-value">
          ${fmt(stock.pe,2)}
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          股價淨值比
        </div>

        <div class="metric-value">
          ${fmt(stock.pbr,2)}
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          殖利率
        </div>

        <div class="metric-value">
          ${
            stock.yieldRate===null
            ? "—"
            : percent(stock.yieldRate)
          }
        </div>
      </div>


      <div class="metric">
        <div class="metric-title">
          成交量
        </div>

        <div class="metric-value">
          ${fmt(stock.volume/1000,0)} 張
        </div>
      </div>

    </div>


    <div class="reason">

      <div class="reason-title">
        入選原因
      </div>

      ${reasons.map(
        r=>"• "+r
      ).join("<br>")}

    </div>


    <div class="reason">

      <div class="reason-title">
        預算試算
      </div>

      NT$${budget.toLocaleString()}
      約可買
      <strong>
      ${shares.toLocaleString()} 股
      </strong>

      ${
        lots>0
        ? `（${lots} 張 ${
            oddLots>0
            ? `＋ ${oddLots} 股`
            : ""
          }）`
        : "（零股）"
      }

      <br>

      <small>
      僅為股數試算，未計交易手續費。
      </small>

    </div>


    ${
      warnings.length
      ?
      `
      <div class="warning">
        ⚠️ ${warnings.join("；")}
      </div>
      `
      :
      ""
    }

  </div>
  `;
}


async function runScreener(){

  const status=
    document.getElementById("status");

  const results=
    document.getElementById("results");

  const updated=
    document.getElementById("updated");


  const budget=
    Number(
      document.getElementById("budget").value
    ) || 50000;


  const limit=
    Number(
      document.getElementById("limit").value
    ) || 20;


  status.innerHTML=
    "⏳ 正在讀取最新市場資料並進行自動篩選…";

  results.innerHTML="";
  updated.innerHTML="";


  try{

    const data=
      await loadStockData();


    marketData=
      Array.isArray(data)
      ? data
      : (
          Array.isArray(data.stocks)
          ? data.stocks
          : []
        );


    if(!marketData.length){
      throw new Error(
        "stocks.json 沒有股票資料"
      );
    }


    let candidates=
      marketData
      .filter(stock=>{

        const price=num(stock.price);
        const volume=num(stock.volume) || 0;

        if(price===null || price<=0){
          return false;
        }

        /*
          排除成交量太低
        */

        if(volume<100000){
          return false;
        }

        return true;

      })
      .map(scoreStock);


    /*
      優先保留有營收資料的公司
    */

    const withRevenue=
      candidates.filter(
        s=>s.revenueYoy!==null
      );


    if(withRevenue.length>=limit){
      candidates=withRevenue;
    }


    /*
      排除營收大幅衰退
    */

    const healthyRevenue=
      candidates.filter(
        s=>
        s.revenueYoy===null ||
        s.revenueYoy>-30
      );


    if(healthyRevenue.length>=limit){
      candidates=healthyRevenue;
    }


    /*
      排序：
      先總分
      再營收成長
      再成交量
    */

    candidates.sort((a,b)=>{

      if(b.score!==a.score){
        return b.score-a.score;
      }

      const ar=
        a.revenueYoy===null
        ? -999
        : a.revenueYoy;

      const br=
        b.revenueYoy===null
        ? -999
        : b.revenueYoy;

      if(br!==ar){
        return br-ar;
      }

      return b.volume-a.volume;

    });


    const selected=
      candidates.slice(0,limit);


    if(!selected.length){

      results.innerHTML=
        `<div class="empty">
        今天沒有符合條件的候選股票。
        </div>`;

      status.innerHTML=
        "掃描完成，但目前沒有符合條件的股票。";

      return;
    }


    status.innerHTML=
      `✅ 選股完成。
      共讀取 ${marketData.length.toLocaleString()} 檔資料，
      篩選後顯示前 ${selected.length} 檔研究候選。`;


    results.innerHTML=
      selected
      .map(
        (stock,index)=>
        renderStock(
          stock,
          index,
          budget
        )
      )
      .join("");


    if(data.updated){

      updated.innerHTML=
        "市場資料更新時間："+
        data.updated;

    }


  }
  catch(error){

    console.error(error);

    status.innerHTML=
      "❌ 無法讀取 stocks.json。請確認 GitHub 自動更新資料已成功產生。";

    results.innerHTML=
      `<div class="empty">
      資料載入失敗，請稍後重新整理再試。
      </div>`;

  }

}

</script>

</body>
</html>
