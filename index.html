<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的台股選股器 V1</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 20px;
  color: #1f2937;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  margin-bottom: 5px;
}

.subtitle {
  color: #6b7280;
  margin-bottom: 25px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

label {
  display: block;
  margin-top: 14px;
  font-weight: 600;
}

input, select {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: #111827;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

.score {
  font-size: 42px;
  font-weight: bold;
  text-align: center;
  margin: 10px;
}

.result {
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.note {
  color: #6b7280;
  font-size: 13px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 我的台股選股器</h1>
<div class="subtitle">V1｜把「想買」變成有規則的判斷</div>

<div class="card">

<label>股票名稱</label>
<input id="stock" placeholder="例如：鴻海">

<label>目前股價（元）</label>
<input id="price" type="number" placeholder="例如：220">

<label>預計投入金額（元）</label>
<input id="money" type="number" value="50000">

<label>產業趨勢</label>
<select id="trend">
<option value="30">強勢成長</option>
<option value="22">穩定成長</option>
<option value="14">普通</option>
<option value="5">偏弱</option>
</select>

<label>公司基本面</label>
<select id="fundamental">
<option value="30">非常好</option>
<option value="23">良好</option>
<option value="15">普通</option>
<option value="5">偏弱</option>
</select>

<label>目前估值</label>
<select id="valuation">
<option value="25">便宜</option>
<option value="20">合理</option>
<option value="12">稍貴</option>
<option value="5">明顯偏貴</option>
</select>

<label>近期股價位置</label>
<select id="position">
<option value="15">整理後／相對低檔</option>
<option value="11">中間位置</option>
<option value="6">接近近期高點</option>
<option value="2">短線急漲</option>
</select>

<button onclick="calculate()">開始評估</button>

</div>

<div class="card" id="resultCard" style="display:none">

<div>綜合分數</div>
<div class="score" id="score">0</div>
<div class="result" id="result"></div>

<p id="shares"></p>

</div>

<div class="card note">
這是個人化的投資研究與紀律工具，不代表股票未來一定上漲。
V1 先建立評估框架；後續版本可加入台股即時資料、自動財報分析、
技術面、ETF比較、自選股與手機版功能。
</div>

</div>

<script>
function calculate() {

  const stock =
    document.getElementById("stock").value || "這檔股票";

  const price =
    Number(document.getElementById("price").value);

  const money =
    Number(document.getElementById("money").value);

  const score =
    Number(document.getElementById("trend").value) +
    Number(document.getElementById("fundamental").value) +
    Number(document.getElementById("valuation").value) +
    Number(document.getElementById("position").value);

  document.getElementById("score").innerText = score + " / 100";

  let result;

  if (score >= 85) {
    result = "條件相對完整，可列入優先研究名單";
  } else if (score >= 70) {
    result = "條件不錯，可持續追蹤";
  } else if (score >= 55) {
    result = "條件普通，建議等待更好的價格或訊號";
  } else {
    result = "目前條件較弱，先觀察";
  }

  document.getElementById("result").innerText =
    stock + "｜" + result;

  if (price > 0 && money > 0) {

    const shares = Math.floor(money / price);
    const lots = Math.floor(shares / 1000);
    const odd = shares % 1000;

    document.getElementById("shares").innerText =
      "投入約 NT$" +
      money.toLocaleString() +
      "，依輸入價格最多約可買 " +
      shares.toLocaleString() +
      " 股（" +
      lots +
      " 張 + " +
      odd +
      " 股零股）。";
  }

  document.getElementById("resultCard").style.display = "block";
}

</script>

</body>
</html>
