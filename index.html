<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的台股選股器 V2</title>

<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
  color:#172033;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  margin-bottom:5px;
}

.subtitle{
  color:#6b7280;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:22px;
  border-radius:18px;
  margin-bottom:18px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

label{
  display:block;
  font-weight:600;
  margin-top:15px;
  margin-bottom:6px;
}

input,select{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  padding:15px;
  margin-top:22px;
  border:0;
  border-radius:12px;
  background:#111827;
  color:white;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

.score{
  text-align:center;
  font-size:42px;
  font-weight:800;
  margin:10px 0;
}

.result{
  text-align:center;
  font-size:18px;
  font-weight:700;
  line-height:1.6;
}

.detail{
  margin-top:20px;
  line-height:1.8;
}

.money{
  background:#f8fafc;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  line-height:1.8;
}

.tag{
  display:inline-block;
  background:#eef2ff;
  padding:5px 10px;
  border-radius:20px;
  margin:3px;
  font-size:14px;
}

.notice{
  font-size:13px;
  color:#6b7280;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 我的台股選股器</h1>
<div class="subtitle">
V2｜把「想買」變成有規則的投資判斷
</div>

<div class="card">

<label>股票代號</label>
<input id="code" placeholder="例如：2330">

<label>股票名稱</label>
<input id="stock" placeholder="例如：台積電">

<label>目前股價（元）</label>
<input id="price" type="number" step="0.01" placeholder="例如：1200">

<label>預計投入金額（元）</label>
<input id="money" type="number" value="50000">

<label>產業趨勢</label>
<select id="trend">
<option value="25">🚀 強勢成長</option>
<option value="18">📈 穩定成長</option>
<option value="10">➖ 普通</option>
<option value="3">📉 衰退</option>
</select>

<label>公司基本面</label>
<select id="fundamental">
<option value="25">非常好</option>
<option value="18">良好</option>
<option value="10">普通</option>
<option value="3">偏弱</option>
</select>

<label>目前估值</label>
<select id="valuation">
<option value="25">便宜</option>
<option value="18">合理</option>
<option value="10">稍貴</option>
<option value="3">明顯偏貴</option>
</select>

<label>近期股價位置</label>
<select id="position">
<option value="25">整理後／相對低檔</option>
<option value="18">中間位置</option>
<option value="10">近期偏高</option>
<option value="3">急漲／高檔</option>
</select>

<button onclick="evaluateStock()">
開始評估
</button>

</div>

<div class="card" id="resultCard" style="display:none">

<div>綜合分數</div>

<div class="score" id="score"></div>

<div class="result" id="result"></div>

<div class="money" id="shares"></div>

<div class="detail" id="detail"></div>

</div>

<div class="card notice">

<strong>V2 使用原則</strong><br><br>

這是一個個人化的投資研究與紀律工具，
不是預測股票一定上漲的系統。

V2 將「產業、基本面、估值、股價位置」
拆開評估，避免只因為喜歡某家公司就直接買進。

下一階段可加入：
台股即時資料、自動帶入股價、ETF比較、
自選股清單與手機版快速評估功能。

</div>

</div>

<script>

function evaluateStock(){

const code =
document.getElementById("code").value.trim();

const stock =
document.getElementById("stock").value.trim();

const price =
parseFloat(document.getElementById("price").value);

const money =
parseFloat(document.getElementById("money").value);

const trend =
parseInt(document.getElementById("trend").value);

const fundamental =
parseInt(document.getElementById("fundamental").value);

const valuation =
parseInt(document.getElementById("valuation").value);

const position =
parseInt(document.getElementById("position").value);

if(!stock){
alert("請輸入股票名稱");
return;
}

if(!price || price <= 0){
alert("請輸入目前股價");
return;
}

if(!money || money <= 0){
alert("請輸入預計投入金額");
return;
}

const score =
trend +
fundamental +
valuation +
position;

document.getElementById("score").innerText =
score + " / 100";

let result;

if(score >= 85){

result =
"條件相對完整，可列入優先研究名單";

}else if(score >= 70){

result =
"條件不錯，可持續追蹤";

}else if(score >= 55){

result =
"條件普通，建議等待更好的價格或訊號";

}else{

result =
"目前條件較弱，先觀察";

}

let title = "";

if(code){
title = code + " " + stock;
}else{
title = stock;
}

document.getElementById("result").innerText =
title + "｜" + result;


// 股數計算

const shares =
Math.floor(money / price);

const lots =
Math.floor(shares / 1000);

const odd =
shares % 1000;

const usedMoney =
shares * price;

const remaining =
money - usedMoney;

document.getElementById("shares").innerHTML =

"<strong>💰 資金試算</strong><br>" +

"投入預算：約 NT$" +
money.toLocaleString() +

"<br>目前股價：NT$" +
price.toLocaleString() +

"<br><br>最多約可買：" +

"<strong>" +
shares.toLocaleString() +
" 股</strong>" +

"<br>" +

lots +
" 張 + " +

odd +
" 股零股" +

"<br><br>預估使用：" +
Math.round(usedMoney).toLocaleString() +
" 元" +

"<br>剩餘資金：約 " +
Math.round(remaining).toLocaleString() +
" 元";


// 分項評估

document.getElementById("detail").innerHTML =

"<strong>📊 四大評估項目</strong><br><br>" +

"<span class='tag'>產業趨勢 " +
trend +
"/25</span>" +

"<span class='tag'>基本面 " +
fundamental +
"/25</span>" +

"<span class='tag'>估值 " +
valuation +
"/25</span>" +

"<span class='tag'>股價位置 " +
position +
"/25</span>";

document.getElementById("resultCard").style.display =
"block";

document.getElementById("resultCard").scrollIntoView({
behavior:"smooth"
});

}

</script>

</body>
</html>
